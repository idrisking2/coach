<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boulder Super Coach</title>
<style>
:root{--bg:#0b0f17;--card:#151c29;--card2:#202a3a;--text:#f4f7fb;--muted:#aab6c8;--line:#334057;--blue:#6f98ff;--green:#45c47b;--yellow:#f0b84d;--red:#ee6a6a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}header{position:sticky;top:0;background:#0b0f17;border-bottom:1px solid var(--line);z-index:5;padding:14px}h1{margin:0;font-size:22px}small,.small{color:var(--muted);font-size:12px;line-height:1.4}nav{display:flex;gap:8px;overflow:auto;padding:10px 14px;border-bottom:1px solid var(--line)}nav button{white-space:nowrap;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:999px;padding:8px 11px;font-weight:700}nav button.active{background:#2455e6}main{padding:14px;max-width:900px;margin:0 auto}.page{display:none}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 10px 25px rgba(0,0,0,.25)}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 7px;color:#dfe8f8}.metric{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.metric b{font-size:25px}.pill{display:inline-block;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:5px 9px;margin:3px;font-size:12px}.good{background:rgba(69,196,123,.15);border-color:rgba(69,196,123,.4)}.warn{background:rgba(240,184,77,.16);border-color:rgba(240,184,77,.4)}.bad{background:rgba(238,106,106,.16);border-color:rgba(238,106,106,.4)}input,select,textarea,button{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:10px;font:inherit}textarea{min-height:75px}label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}button.primary{background:#2455e6;border:0;font-weight:800}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:620px){.row{grid-template-columns:1fr}}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}.notice{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;line-height:1.45}.bar{height:11px;background:#0f1622;border-radius:999px;border:1px solid var(--line);overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red))}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Boulder Super Coach</h1><div class="small">Readiness · 10-Tage-Plan · Fingerlast · Technik · MoonBoard</div></header>
<nav id="nav"></nav><main><section id="dash" class="page active"></section><section id="today" class="page"></section><section id="plan" class="page"></section><section id="log" class="page"></section><section id="finger" class="page"></section><section id="tech" class="page"></section><section id="moon" class="page"></section><section id="data" class="page"></section></main>
<script>
const today=new Date().toISOString().slice(0,10);const pages=[['dash','Dashboard'],['today','Heute'],['plan','Plan'],['log','Log'],['finger','Finger'],['tech','Technik'],['moon','MoonBoard'],['data','Daten']];
const defPlan=[['MoonBoard Haupttag','8','6-8','Leistung, harte Züge, lange Pausen. Max. 12-18 ernsthafte Versuche.'],['Pause','0-2','0','Gewebe, Haut, Nervensystem. Kein Fingertraining.'],['Technik leicht','3-4','2-3','Fußdruck, Hüfte vor Hand, No-Pull, Silent Feet.'],['Skill-Projekt','5-6','3-5','Hooks, Volumen, Koordination, Videoanalyse. Qualität vor Menge.'],['Kraft/Capacity','4-6','0-3','Beine, Hüfte, Hamstrings, Core, Schulter. Keine harte Fingerlast.'],['Board submaximal','6-7','5-6','6C-7A wiederholbar, Boardpräzision, kein Projektkrieg.'],['Technik/Volumen','3-5','2-4','Bewegungsbibliothek, große Griffe, verschiedene Stile.'],['Pause/Low-Day','0-2','0-1','Low-Day erzwingen, auch wenn du frisch bist.'],['Board/Power Haupttag','8','6-8','Zweiter harter Reiz, anderer Stressor als Tag 1.'],['Analyse + Prehab','1-3','0-1','Video, Wall Crawls leicht, Mobility, ein Cue für den nächsten Zyklus.']];
const types=['MoonBoard Haupttag','Board submaximal','Spraywall/Power','Technik leicht','Skill-Projekt','Volumen/Kompression','Platte/Vertikal','Kraft/Prehab ohne Finger','Conditioning','Mobility/Analyse','Pause'];
const stress=['kleine Leisten','dynamische Catches','Hooks/Heel/Toe','derselbe harte Zug oft','MoonBoard/Spraywall hart','Haut limitiert','Kompression','Platte/Vertikal','Volumen','Campus/Power','Full Crimp'];
const drills=[['Fußdruck halten','Der Fuß bleibt bis nach dem Catch aktiv.','Submax Board: zählen, wie oft der Fuß nach Griffkontakt bleibt.'],['Hüfte vor Hand','Erst Schwerpunkt, dann Griff.','Vor schwerem Zug 1 s Setup halten, dann ziehen.'],['Aktiver Hook','Hook macht mich kurz.','Hook setzen, 2 s Spannung, dann Hand bewegen.'],['Less Pull / More Feet','Wenn ich stark ziehen muss, war die Position schlecht.','No-Pull Bouldern auf leichten/mittleren Bouldern.'],['Board Deadpoint','Leise Hand, stabiler Catch.','5-8 Deadpoints, kontrollierter Kontakt statt maximale Weite.'],['Beta-Entscheidung','Ein Versuch, ein Cue.','Motorfuß, Hüftweg, Catch, No-Cut-Punkt definieren.']];
function base(){return{start:today,sessions:[],readiness:[],moon:[],goals:['7A am MoonBoard zuverlässig machen','12 Monate fingergesund bleiben','Mehr über die Füße ziehen'],plan:defPlan}}
let data;try{data=JSON.parse(localStorage.boulderCoach||'null')||base()}catch(e){data=base()}function save(){localStorage.boulderCoach=JSON.stringify(data)}function esc(x){return String(x||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function n(x){return Number(x||0)}function addDays(ds,d){let x=new Date(ds+'T00:00:00');x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)}function diff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}function ago(ds){return diff(ds,today)}function recent(d){return data.sessions.filter(s=>ago(s.date)>=0&&ago(s.date)<d)}function isClimb(s){return !['Pause','Kraft/Prehab ohne Finger','Conditioning','Mobility/Analyse'].includes(s.type)&&n(s.rpe)>0}function planFor(ds){let i=((diff(data.start,ds)%10)+10)%10;return data.plan[i]}
function status(){let r=recent(10),sum=r.reduce((a,s)=>a+n(s.rpe),0),cl=r.filter(isClimb).length,avg=r.length?r.reduce((a,s)=>a+n(s.finger),0)/r.length:0,last=r.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];let score=100,w=[];if(last&&n(last.rpe)>=8){score-=30;w.push('Letzte Session RPE >=8: heute Pause oder RPE 0-3.')}if(last&&n(last.finger)>=7){score-=30;w.push('Finger-RPE hoch: kein Board, keine kleinen Leisten.')}if(r.some(s=>s.fstatus&&s.fstatus!='normal')){score-=40;w.push('Fingerstatus auffällig: Crimps/Board rausnehmen.')}if(cl>=8||sum>=50){score-=20;w.push('10-Tage-Block dicht: Low-Day sinnvoll.')}score=Math.max(0,Math.min(100,score));return{r,sum,cl,avg,last,score,w}}
function nav(){document.getElementById('nav').innerHTML=pages.map(p=>`<button onclick="show('${p[0]}')" id="n_${p[0]}" class="${p[0]=='dash'?'active':''}">${p[1]}</button>`).join('')}function show(id){pages.forEach(p=>{document.getElementById(p[0]).classList.toggle('active',p[0]==id);document.getElementById('n_'+p[0]).classList.toggle('active',p[0]==id)});render()}
function render(){dash();todayPage();planPage();logPage();fingerPage();techPage();moonPage();dataPage()}function cls(s){return s<45?'bad':s<70?'warn':'good'}function dash(){let s=status(),p=planFor(today);document.getElementById('dash').innerHTML=`<div class="card ${cls(s.score)}"><h2>Readiness</h2><div class="metric"><span>Score</span><b>${s.score}</b></div><div class="bar"><div style="width:${s.score}%"></div></div><div class="small">Berücksichtigt RPE, Finger-RPE, Dichte, Fingerstatus und letzte Belastung.</div></div><div class="grid"><div class="card"><h2>10-Tage-Last</h2><div class="metric"><span>RPE-Summe</span><b>${s.sum}</b></div><div class="metric"><span>Klettertage</span><b>${s.cl}/10</b></div><div class="metric"><span>Ø Finger-RPE</span><b>${s.avg.toFixed(1)}</b></div></div><div class="card"><h2>Heute geplant</h2><div class="notice"><b>${esc(p[0])}</b><br>RPE ${p[1]} · Finger ${p[2]}<br><span class="small">${esc(p[3])}</span></div></div></div><div class="card"><h2>Coach-Empfehlung</h2><div class="notice ${cls(s.score)}"><b>${s.score<45?'Pause oder RPE 0-3. Kein Board, keine Leisten.':s.score<70?'RPE 3-5, anderer Stressor, kein Projektkrieg.':'Training möglich, wenn Finger/Haut normal sind.'}</b></div>${s.w.length?s.w.map(x=>`<span class="pill bad">${esc(x)}</span>`).join(''):'<span class="pill good">Keine akute Warnung.</span>'}</div><div class="card"><h2>Letzte Sessions</h2>${sessionTable(recent(30).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))}</div>`}
function todayPage(){let s=status(),p=planFor(today),rec=s.score<45?'Pause':s.score<70&&p[1].includes('8')?'Technik leicht':p[0];document.getElementById('today').innerHTML=`<div class="card"><h2>Heute-Coach</h2><div class="metric"><span>Empfehlung</span><b>${esc(rec)}</b></div><div class="notice"><b>Plan:</b> ${esc(p[0])}<br><b>Anpassung:</b> ${esc(rec)}<br><br>${s.score<45?'Gewebe schützen. Spaziergang, Mobility, Analyse.':s.score<70?'Qualität vor Menge. Keine kleinen Leisten stapeln.':'Hauptsession möglich. Lange Pausen, klare Stop-Regeln.'}</div></div><div class="card"><h2>Stop-Regeln</h2><span class="pill bad">Kontaktqualität sinkt</span><span class="pill bad">Ringband steif</span><span class="pill bad">Finger-RPE >7</span><span class="pill warn">3 Klettertage am Stück</span><span class="pill warn">Haut limitiert</span></div>`}
function planPage(){let html='<div class="card"><h2>10-Tage-Mikrozyklus</h2><table><tr><th>Tag</th><th>Einheit</th><th>RPE</th><th>Finger</th></tr>';data.plan.forEach((p,i)=>html+=`<tr><td>${i+1}</td><td><b>${esc(p[0])}</b><br><span class="small">${esc(p[3])}</span></td><td>${p[1]}</td><td>${p[2]}</td></tr>`);html+='</table></div><div class="card"><h2>12-Wochen-Struktur</h2><div class="notice"><b>Wochen 1-4:</b> Kapazität + Struktur. Randomness reduzieren, Finger stabil, 5 MoonBoard-7A-Marker definieren.<br><br><b>Wochen 5-8:</b> Spezifische Board-Progression. 7A wiederholbarer, 7A+/7B-Züge isolieren.<br><br><b>Wochen 9-12:</b> Konsolidierung. Fortschritt zeigen ohne voll zu peaken.</div></div>';document.getElementById('plan').innerHTML=html}
function logPage(){document.getElementById('log').innerHTML=`<div class="card"><h2>Session loggen</h2><label>Datum</label><input id="ldate" type="date" value="${today}"><label>Typ</label><select id="ltype">${types.map(t=>`<option>${t}</option>`).join('')}</select><div class="row"><div><label>Gesamt-RPE</label><input id="lrpe" type="number" value="5" step=".5"></div><div><label>Finger-RPE</label><input id="lfinger" type="number" value="4" step=".5"></div></div><div class="row"><div><label>Koordination-RPE</label><input id="lcoord" type="number" value="5" step=".5"></div><div><label>Dauer min</label><input id="lmin" type="number" value="90"></div></div><label>Fingerstatus</label><select id="lfstatus"><option>normal</option><option>leichte Steifigkeit</option><option>leichte Druckempfindlichkeit</option><option>Schmerz/Unsicherheit</option></select><label>Stressoren</label>${stress.map((x,i)=>`<label><input type="checkbox" id="st${i}" style="width:auto"> ${x}</label>`).join('')}<label>Fokus / Ergebnis / Learning</label><textarea id="lnotes"></textarea><button class="primary" onclick="addLog()">Speichern</button></div><div class="card"><h2>Historie</h2>${sessionTable(data.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30))}</div>`}
function addLog(){let st=stress.filter((_,i)=>document.getElementById('st'+i).checked);data.sessions.push({date:ldate.value,type:ltype.value,rpe:n(lrpe.value),finger:n(lfinger.value),coord:n(lcoord.value),min:n(lmin.value),fstatus:lfstatus.value,stress:st,notes:lnotes.value});save();render()}
function sessionTable(a){if(!a.length)return'<div class="small">Noch keine Einträge.</div>';return`<table><tr><th>Datum</th><th>Typ</th><th>RPE</th><th>Finger</th></tr>${a.map(s=>`<tr><td>${s.date}</td><td><b>${esc(s.type)}</b><br><span class="small">${esc(s.notes)}</span></td><td>${s.rpe}</td><td>${s.finger}<br><span class="small">${esc(s.fstatus)}</span></td></tr>`).join('')}</table>`}
function fingerPage(){document.getElementById('finger').innerHTML=`<div class="card"><h2>Fingertraining</h2><div class="notice"><b>Density / Kapazität:</b> 1x/10 Tage, 20 mm, 3-5x20-40 s, RPE 5-6. Nicht auf 10/6 mm.<br><br><b>Recruitment:</b> 1x/10 Tage, 20/10 mm, 3-5x3-5 s, RPE 7-8. Kein Max-Test.<br><br><b>6-8 mm Gewöhnung:</b> optional alle 10-14 Tage, nur bei perfektem Fingerstatus, assistiert, RPE 6-7.</div></div><div class="card bad"><h2>Finger-Regeln</h2>Ringband-Steifigkeit: kein Board, keine Crimps. Druckempfindlichkeit: 48-72 h keine Fingerlast. Schmerz/Unsicherheit: abbrechen.</div>`}
function techPage(){document.getElementById('tech').innerHTML=`<div class="card"><h2>Technikbibliothek</h2>${drills.map(d=>`<div class="notice" style="margin-bottom:8px"><b>${d[0]}</b><br><span class="pill">${d[1]}</span><br><span class="small">${d[2]}</span></div>`).join('')}</div>`}
function moonPage(){document.getElementById('moon').innerHTML=`<div class="card"><h2>MoonBoard Marker</h2><label>Name/Zug</label><input id="mname"><div class="row"><div><label>Grad</label><select id="mgrade"><option>6C</option><option>6C+</option><option>7A</option><option>7A+</option><option>7B</option><option>7B+</option><option>7C</option></select></div><div><label>Status</label><select id="mstat"><option>versucht</option><option>Einzelzug geschafft</option><option>in Links</option><option>Top</option><option>wiederholbar</option></select></div></div><label>Limiter/Notiz</label><textarea id="mnote"></textarea><button class="primary" onclick="addMoon()">Speichern</button></div><div class="card"><h2>Marker</h2>${moonTable()}</div><div class="card"><h2>Testsystem</h2><div class="notice">Definiere 5 wiederholbare 7A und 5 harte Einzelzüge aus 7A+/7B. Alle 2 Wochen vergleichbar testen, ohne die Session zu zerstören.</div></div>`}
function addMoon(){data.moon.push({date:today,name:mname.value,grade:mgrade.value,status:mstat.value,note:mnote.value});save();render()}function moonTable(){if(!data.moon.length)return'<div class="small">Noch keine Marker.</div>';return`<table><tr><th>Datum</th><th>Name</th><th>Grad</th><th>Status</th></tr>${data.moon.map(m=>`<tr><td>${m.date}</td><td>${esc(m.name)}<br><span class="small">${esc(m.note)}</span></td><td>${m.grade}</td><td>${m.status}</td></tr>`).join('')}</table>`}
function dataPage(){document.getElementById('data').innerHTML=`<div class="card"><h2>Daten</h2><button class="primary" onclick="exp()">Export JSON</button><label>Import JSON</label><textarea id="imp"></textarea><button onclick="try{data=JSON.parse(imp.value);save();render()}catch(e){alert('Import fehlgeschlagen')}">Importieren</button><button onclick="if(confirm('Alles löschen?')){localStorage.removeItem('boulderCoach');data=base();save();render()}">Alles löschen</button></div>`}
function exp(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='boulder-coach-data.json';a.click()}
nav();render();
</script>
</body></html>
