<!doctype html>
<html lang='de'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Boulder Super Coach 52</title>
<style>
:root{--bg:#090e16;--p:#121a27;--p2:#1a2536;--p3:#233148;--t:#f4f7fd;--m:#a9b6c8;--l:#33445f;--b:#6f98ff;--g:#45c47b;--y:#f0b84d;--r:#ef6c6c;--v:#b58cff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#090e16,#111827 55%,#0b0f17);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}header{position:sticky;top:0;z-index:20;background:rgba(9,14,22,.97);border-bottom:1px solid var(--l);padding:13px 14px;backdrop-filter:blur(12px)}h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--m);margin-top:2px}nav{display:flex;gap:7px;overflow:auto;padding:10px 14px;border-bottom:1px solid var(--l);position:sticky;top:63px;background:rgba(9,14,22,.95);z-index:15}nav button{white-space:nowrap;width:auto;border:1px solid var(--l);background:var(--p2);color:var(--t);border-radius:999px;padding:8px 10px;font-weight:750}nav button.a{background:#2455e6;border-color:var(--b)}main{max-width:1050px;margin:0 auto;padding:14px}.page{display:none}.page.a{display:block}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:14px;margin-bottom:13px;box-shadow:0 10px 28px rgba(0,0,0,.28)}h2{font-size:17px;margin:0 0 11px}h3{font-size:14px;margin:14px 0 7px;color:#dfe8f8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:760px){.grid,.grid3,.grid4{grid-template-columns:1fr}nav{top:58px}}.metric{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--p2);border:1px solid var(--l);border-radius:15px;padding:12px;margin:8px 0}.metric b{font-size:25px}.notice{background:var(--p2);border:1px solid var(--l);border-radius:15px;padding:12px;line-height:1.45}.pill{display:inline-block;border-radius:999px;background:var(--p3);border:1px solid var(--l);padding:5px 9px;margin:3px;font-size:12px}.good{background:rgba(69,196,123,.15)!important;border-color:rgba(69,196,123,.43)!important}.warn{background:rgba(240,184,77,.15)!important;border-color:rgba(240,184,77,.42)!important}.bad{background:rgba(239,108,108,.15)!important;border-color:rgba(239,108,108,.42)!important}.blue{background:rgba(111,152,255,.14)!important;border-color:rgba(111,152,255,.38)!important}.vio{background:rgba(181,140,255,.14)!important;border-color:rgba(181,140,255,.38)!important}.small{font-size:12px;color:var(--m);line-height:1.45}label{display:block;color:var(--m);font-size:12px;margin:10px 0 5px}input,select,textarea,button{width:100%;border:1px solid var(--l);background:var(--p2);color:var(--t);border-radius:12px;padding:10px;font:inherit}textarea{min-height:82px}button{cursor:pointer}button.pri{background:#2455e6;border:0;font-weight:800}button.sec{background:var(--p3)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--l);padding:8px 6px;text-align:left;vertical-align:top}th{color:var(--m)}.bar{height:11px;background:#101722;border:1px solid var(--l);border-radius:999px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,var(--g),var(--y),var(--r))}.wk{border-left:5px solid var(--b)}.cap{border-left-color:var(--g)}.str{border-left-color:var(--y)}.pow{border-left-color:var(--r)}.perf{border-left-color:var(--v)}.del{border-left-color:#7e8797}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:620px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Boulder Super Coach 52</h1><div class='sub'>Jahresplan · Capacity · Readiness · Finger-Risiko · MoonBoard · Hallenskala 1-6</div></header>
<nav id='nav'></nav>
<main>
<section id='dash' class='page a'></section><section id='today' class='page'></section><section id='year' class='page'></section><section id='cap' class='page'></section><section id='cycle' class='page'></section><section id='log' class='page'></section><section id='finger' class='page'></section><section id='strength' class='page'></section><section id='tech' class='page'></section><section id='moon' class='page'></section><section id='ana' class='page'></section><section id='data' class='page'></section>
</main>
<script>
const today=new Date().toISOString().slice(0,10);
const pages=[['dash','Dashboard'],['today','Heute'],['year','52 Wochen'],['cap','Capacity'],['cycle','10-Tage'],['log','Log'],['finger','Finger'],['strength','Kraft'],['tech','Technik'],['moon','MoonBoard'],['ana','Analyse'],['data','Daten']];
const phases=[
{a:1,b:10,n:'Capacity + Bewegung',c:'cap',r:'RPE 3-6, selten 7',d:'4 Bouldertage + 1 optional leicht + 1 Conditioning + 1 Pause. Ziel: 4er billiger, 5er wiederholbarer, Finger stabil, technische Bibliothek.'},
{a:11,b:11,n:'Deload 1',c:'del',r:'RPE 2-4',d:'30-40 Prozent weniger Volumen. Keine 6er. Mehr Mobility, Spaziergänge, Technik.'},
{a:12,b:20,n:'Strength + Boardkraft',c:'str',r:'RPE 5-8',d:'2 Boardtage, 1 Skilltag, 1 Techniktag, 1 Krafttag. Finger-Recruitment kontrolliert, mehr 5er/kurze 6er-Züge.'},
{a:21,b:21,n:'Deload 2',c:'del',r:'RPE 2-4',d:'Belastung runter, Haut/Finger resetten, Videoauswertung.'},
{a:22,b:29,n:'Power + Kontaktkraft',c:'pow',r:'RPE 6-9, wenig Volumen',d:'Harte Einzelzüge, Deadpoints, MoonBoard-Schärfe, lange Pausen. Nur 2 rote Tage pro 10 Tage.'},
{a:30,b:30,n:'Deload 3',c:'del',r:'RPE 1-4',d:'Keine Max-Catches. Viel Technik, Erholung, Prehab.'},
{a:31,b:38,n:'Power-Endurance + Projektkapazität',c:'str',r:'RPE 5-8',d:'Mehr gute Versuche pro Session, Links, Wiederholungen, 5er/6er-Projektfähigkeit ohne Zerfall.'},
{a:39,b:39,n:'Deload 4',c:'del',r:'RPE 1-4',d:'Frische zurückholen, Fingerstatus prüfen.'},
{a:40,b:48,n:'Performance / 8A-orientiert',c:'perf',r:'RPE 6-9',d:'Gezielte Projekte, kurze harte Sessions, Taper-Elemente. Weniger Volumen, mehr Qualität.'},
{a:49,b:49,n:'Test + Standortbestimmung',c:'perf',r:'kontrolliert',d:'5er-Quote, 6er-Touches, MoonBoard-Marker, Fingerreaktion am nächsten Morgen.'},
{a:50,b:52,n:'Transition / Rebuild',c:'del',r:'RPE 2-5',d:'Spaß, Technik, Verletzungsprävention, Planung des nächsten Jahres.'}
];
const capBlocks=[
{w:'1-2',name:'Kalibrierung',days:'4 Boulder + 1 Conditioning + 1 Pause',mix:'1-2:20%, 3:25%, 4:40%, 5:15%, 6:0%',goal:'RPE lernen, keine 6er, Fingerstatus beobachten, 4er technisch sauber.'},
{w:'3-4',name:'Volumenaufbau',days:'4 Boulder + optional 1 leicht',mix:'1-2:15%, 3:25%, 4:40%, 5:18%, 6:2%',goal:'mehr 4er/5er, 3-5 kurze 6er-Versuche pro Woche, kein Projektieren.'},
{w:'5-6',name:'Capacity-Peak',days:'4-5 Boulder + Conditioning + Pause',mix:'1-2:10-15%, 3:20-25%, 4:40%, 5:20-25%, 6:2-5%',goal:'höchste Menge hochwertiger Kontakte. 5x Bouldern nur bei perfekten Fingern.'},
{w:'7',name:'Deload',days:'3-4 Boulder leicht + 2 Pausen',mix:'weniger 5er, keine 6er',goal:'30-40% weniger Volumen, Lust und Frische zurückholen.'},
{w:'8-9',name:'Spezifische Capacity',days:'4 Boulder + optional 1 leicht',mix:'1-2:10-15%, 3:20%, 4:35-40%, 5:25-30%, 6:3-5%',goal:'5er schneller lesen, mehr Flashes/2nd-go, kurze 6er-Touches.'},
{w:'10',name:'Konsolidierung + Mini-Test',days:'3-4 Boulder + 2 Pausen',mix:'Test: 8-12 4er, 6-8 5er max 3 Versuche, 1-2 6er max 3 Versuche',goal:'Kein Peak. Prüfen: 5er-Quote, Technik, Fingerreaktion.'}
];
const cycle=[['Board submax','90-105 min','RPE 6','8-12 Warm-up 1-3, 4-6 4er, 6-10 5er, 2-3 Wiederholungen. Pausen: 4er 1-2 min, 5er 2-4 min.'],['Conditioning + Density','45-60 min','RPE 4-5','Beine, Hamstrings, Hüfte, Wall Crawls. Optional 20 mm Density 3-4x20-40s RPE 5-6.'],['Technikvolumen','75-90 min','RPE 3-4','6-8 Warm-up, 6-8 3er, 8-12 4er, 2-4 leichte 5er. Silent Feet, No-Pull, Hüfte vor Hand.'],['Pause','0-30 min','RPE 0-2','Spaziergang, Mobility, kein Board, keine Fingerlast.'],['Skill-Projekt','90 min','RPE 5-6','Hooks, Volumen, Koordination, Kreuzzüge. 2 Hauptprobleme, filmen nach 5 Versuchen, stoppen wenn Qualität sinkt.'],['Technik/Volumen','75-90 min','RPE 3-5','Viele 3er/4er, wenige 5er. Bewegungsbibliothek.'],['Mini-Hard-Reiz','45-70 min','RPE 7-8 kurz','3-5 harte Einzelzüge oder 5-8 kurze 6er-Touches. Keine 30 Versuche, lange Pausen.'],['Low-Day','0-45 min','RPE 0-2','Erholung erzwingen.'],['Hallencapacity','90 min','RPE 5-6','athletische 4er, submax 5er, 3 Boulder nochmal besser. Keine maximal fingerlastigen 6er.'],['Analyse + Prehab','30-60 min','RPE 1-3','Video, Mobility, Wall Crawls leicht, ein Cue für nächsten Zyklus.']];
const drills=[['Fußdruck halten','Der Fuß bleibt bis nach dem Catch aktiv.','Submax 4er/5er, zählen wie oft der Fuß nach Kontakt bleibt.'],['Hüfte vor Hand','Erst Schwerpunkt, dann Griff.','Vor jedem schweren Zug Setup 1s einfrieren.'],['Aktiver Hook','Hook macht mich kurz.','Hook setzen, 2s Spannung, dann Hand bewegen.'],['Less Pull / More Feet','Wenn ich stark ziehen muss, war die Position schlecht.','Leichte 3er/4er mit langen Armen.'],['Silent Feet','Leiser Fuß ist präziser Fuß.','10 Boulder ohne hörbares Setzen/Nachrutschen.'],['Repeat Better','Jede Wiederholung billiger.','Einen 4er/5er dreimal klettern, jedes Mal weniger Kraft.'],['Beta-Entscheidung','Ein Versuch, ein Cue.','Motorfuß, Hüftweg, Catch, No-Cut-Punkt definieren.']];
const types=['Board submax','Technikvolumen','Skill-Projekt','Hallencapacity','Mini-Hard-Reiz','Kraft/Capacity','Finger Density','Finger Recruitment','Mobility/Analyse','Pause'];
const stress=['kleine Leisten','dynamische Catches','Hooks','derselbe Zug oft','6er-Touch','MoonBoard/Spraywall','Haut limitiert','Full Crimp','Kompression','Volumen','Platte'];
function base(){return{start:today,week:1,sessions:[],readiness:[],moon:[],goals:[['7A/5er zuverlässiger','5er-Quote 75-85%, weniger Versuche','aktiv'],['12 Monate fingergesund','Keine Ringbandreaktion nach Boardtagen','aktiv'],['Mehr über Füße ziehen','4er/5er mit weniger Cut-loose','aktiv']]}}
let data;try{data=JSON.parse(localStorage.bsc52||'null')||base()}catch(e){data=base()}function save(){localStorage.bsc52=JSON.stringify(data)}function esc(x){return String(x??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function n(x){return Number(x||0)}function dadd(ds,k){let d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+k);return d.toISOString().slice(0,10)}function diff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}function daysAgo(ds){return diff(ds,today)}function recent(k){return data.sessions.filter(s=>daysAgo(s.date)>=0&&daysAgo(s.date)<k)}function isClimb(s){return !['Pause','Mobility/Analyse','Kraft/Capacity','Finger Density','Finger Recruitment'].includes(s.type)&&n(s.rpe)>0}function phase(w){return phases.find(p=>w>=p.a&&w<=p.b)||phases[0]}function cday(ds){let i=((diff(data.start,ds)%10)+10)%10;return cycle[i]}function stat(){let r=recent(10),sum=r.reduce((a,s)=>a+n(s.rpe),0),cl=r.filter(isClimb).length,avg=r.length?r.reduce((a,s)=>a+n(s.finger),0)/r.length:0,last=r.slice().sort((a,b)=>b.date.localeCompare(a.date))[0],score=100,w=[];if(last&&n(last.rpe)>=8){score-=30;w.push('Letzte Session RPE >=8: heute Pause oder RPE 0-3.')}if(last&&n(last.finger)>=7){score-=30;w.push('Finger-RPE hoch: keine kleinen Leisten/kein Board.')}if(r.some(s=>s.fstatus&&s.fstatus!='normal')){score-=40;w.push('Fingerstatus auffällig: Crimps/Board raus.')}if(cl>=8||sum>=50){score-=18;w.push('10-Tage-Block dicht: Low-Day einplanen.')}score=Math.max(0,Math.min(100,Math.round(score)));return{r,sum,cl,avg,last,score,w}}
function nav(){document.getElementById('nav').innerHTML=pages.map(p=>`<button onclick='show(${JSON.stringify(p[0])})' id='n_${p[0]}' class='${p[0]=='dash'?'a':''}'>${p[1]}</button>`).join('')}function show(id){pages.forEach(p=>{document.getElementById(p[0]).classList.toggle('a',p[0]==id);document.getElementById('n_'+p[0]).classList.toggle('a',p[0]==id)});render()}function sc(s){return s<45?'bad':s<70?'warn':'good'}function bar(x,max=100){let p=Math.max(0,Math.min(100,x/max*100));return `<div class='bar'><div style='width:${p}%'></div></div>`}
function render(){dash();todayP();yearP();capP();cycleP();logP();fingerP();strengthP();techP();moonP();anaP();dataP()}
function dash(){let s=stat(),p=phase(data.week),cd=cday(today);dash.innerHTML=`<div class='grid'><div class='card ${sc(s.score)}'><h2>Readiness</h2><div class='metric'><span>Score</span><b>${s.score}</b></div>${bar(s.score)}<div class='small'>Gewichtet Gesamt-RPE, Finger-RPE, Fingerstatus, Dichte und letzte harte Session.</div></div><div class='card'><h2>Aktueller Jahresblock</h2><div class='notice ${p.c}'><b>Woche ${data.week}: ${p.n}</b><br>${p.r}<br><span class='small'>${p.d}</span></div><label>Aktuelle Woche setzen</label><input type='number' min='1' max='52' value='${data.week}' onchange='data.week=n(this.value);save();render()'></div></div><div class='grid3'><div class='card'><h2>10-Tage-RPE</h2><div class='metric'><span>Summe</span><b>${s.sum}</b></div>${bar(s.sum,60)}</div><div class='card'><h2>Klettertage</h2><div class='metric'><span>letzte 10 Tage</span><b>${s.cl}/10</b></div></div><div class='card'><h2>Ø Finger-RPE</h2><div class='metric'><span>letzte 10 Tage</span><b>${s.avg.toFixed(1)}</b></div></div></div><div class='card'><h2>Heute laut 10-Tage-Zyklus</h2><div class='notice blue'><b>${cd[0]}</b> · ${cd[2]}<br><span class='small'>${cd[1]} · ${cd[3]}</span></div></div><div class='card'><h2>Coach-Empfehlung</h2><div class='notice ${sc(s.score)}'><b>${s.score<45?'Pause oder RPE 0-3. Kein Board, keine 5er/6er, keine Leisten.':s.score<70?'RPE 3-5, anderer Stressor. Kein Projektkrieg.':'Plan kann gehalten werden, falls Finger/Haut normal sind.'}</b></div>${s.w.length?s.w.map(x=>`<span class='pill bad'>${esc(x)}</span>`).join(''):`<span class='pill good'>Keine akute Warnung.</span>`}</div><div class='card'><h2>Letzte Sessions</h2>${sessionTable(data.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))}</div>`}
function todayP(){let s=stat(),cd=cday(today),rec=s.score<45?'Pause/Low-Day':s.score<70&&cd[2].includes('8')?'Technik RPE 3-4':cd[0];today.innerHTML=`<div class='card'><h2>Heute-Coach</h2><div class='metric'><span>Empfohlen</span><b>${esc(rec)}</b></div><div class='notice'><b>Geplant:</b> ${esc(cd[0])}<br><b>Dauer:</b> ${esc(cd[1])}<br><b>Intensität:</b> ${esc(cd[2])}<br><br>${esc(cd[3])}</div></div><div class='grid'><div class='card bad'><h2>Harte Regeln</h2><span class='pill bad'>RPE ≥8 → nächster Tag RPE 0-3</span><span class='pill bad'>Finger-RPE ≥7 → kein Board/Crimps</span><span class='pill bad'>Druckempfindlichkeit → 48-72h keine Fingerlast</span><span class='pill warn'>3 Klettertage in Folge → Low-Day</span></div><div class='card'><h2>Hallenskala heute</h2><div class='notice'>1-2 Warm-up/Cooldown. 3 Technik. 4 Hauptvolumen. 5 submax Entwicklung. 6 nur kurze Exposition, kein langer Projektkrieg.</div></div></div>`}
function yearP(){year.innerHTML=`<div class='card'><h2>52-Wochen-Plan</h2><div class='small'>Jahr ist periodisiert: erst Kapazität, dann Kraft, dann Power, dann Projektfähigkeit, dann Performance. Deloads sind Pflicht, nicht optional.</div></div>${phases.map(p=>`<div class='card wk ${p.c}'><h2>Wochen ${p.a}-${p.b}: ${p.n}</h2><span class='pill'>${p.r}</span><div class='notice'>${p.d}</div></div>`).join('')}<div class='card'><h2>Warum so?</h2><div class='notice'>Deine Kraft ist nicht der limitierende Basisfaktor. Du brauchst mehr wiederholbare Qualität, bessere Regeneration, Gewebeverträglichkeit und weniger random RPE-6/7-Mischmasch. Erst wenn Capacity steht, lohnt sich harte Power deutlich mehr.</div></div>`}
function capP(){cap.innerHTML=`<div class='card'><h2>10-Wochen-Capacity-Block</h2><div class='notice good'><b>Ziel:</b> Grad 4 technisch billig machen, Grad 5 wiederholbarer machen, 6er nur dosiert antasten. 4 echte Bouldertage/Woche, 1 optional leichter Slot, 1 Conditioning/Finger-Capacity, 1 Pause.</div></div>${capBlocks.map(b=>`<div class='card cap'><h2>Woche ${b.w}: ${b.name}</h2><span class='pill'>${b.days}</span><span class='pill'>${b.mix}</span><div class='notice'>${b.goal}</div></div>`).join('')}<div class='card'><h2>Session-Mengen</h2><table><tr><th>Session</th><th>Dauer</th><th>Boulderkontakte</th><th>Pausen</th></tr><tr><td>Technikvolumen</td><td>75-90 min</td><td>22-38</td><td>3er 45-75s, 4er 60-120s</td></tr><tr><td>Submax Capacity</td><td>90-105 min</td><td>23-37</td><td>5er 2-4 min</td></tr><tr><td>Skill-Projekt</td><td>90 min</td><td>16-29</td><td>2-4 min, Video nach 5 Versuchen</td></tr><tr><td>Optional leicht</td><td>45-60 min</td><td>10-20</td><td>kurz, kein Pump</td></tr></table></div>`}
function cycleP(){cyclePhtml=cycle.map((x,i)=>`<div class='card'><h2>Tag ${i+1}: ${x[0]}</h2><span class='pill'>${x[1]}</span><span class='pill'>${x[2]}</span><div class='notice'>${x[3]}</div></div>`).join('');cycle.innerHTML=`<div class='card'><h2>10-Tage-Zyklus für Capacity</h2><label>Tag 1 Startdatum</label><input type='date' value='${data.start}' onchange='data.start=this.value;save();render()'><div class='small'>Der heutige Zyklustag wird aus diesem Startdatum berechnet.</div></div>${cyclePhtml}`}
function logP(){log.innerHTML=`<div class='card'><h2>Session loggen</h2><label>Datum</label><input id='ld' type='date' value='${today}'><label>Typ</label><select id='lt'>${types.map(t=>`<option>${t}</option>`).join('')}</select><div class='row'><div><label>Gesamt-RPE</label><input id='lr' type='number' value='5' step='.5'></div><div><label>Finger-RPE</label><input id='lf' type='number' value='4' step='.5'></div></div><div class='row'><div><label>Dauer min</label><input id='lm' type='number' value='90'></div><div><label>Schwierigkeitsschwerpunkt</label><select id='lg'><option>1-3</option><option>4</option><option>5</option><option>6 kurz</option></select></div></div><label>Fingerstatus</label><select id='lfs'><option>normal</option><option>leichte Steifigkeit</option><option>leichte Druckempfindlichkeit</option><option>Schmerz/Unsicherheit</option></select><label>Stressoren</label>${stress.map((x,i)=>`<label><input id='st${i}' type='checkbox' style='width:auto'> ${x}</label>`).join('')}<label>Learning / Ergebnis</label><textarea id='ln'></textarea><button class='pri' onclick='addLog()'>Speichern</button></div><div class='card'><h2>Historie</h2>${sessionTable(data.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40))}</div>`}
function addLog(){let st=stress.filter((_,i)=>document.getElementById('st'+i).checked);data.sessions.push({date:ld.value,type:lt.value,rpe:n(lr.value),finger:n(lf.value),min:n(lm.value),grade:lg.value,fstatus:lfs.value,stress:st,notes:ln.value});save();render()}function sessionTable(a){if(!a.length)return `<div class='small'>Noch keine Einträge.</div>`;return `<table><tr><th>Datum</th><th>Typ</th><th>RPE</th><th>Finger</th><th>Fokus</th></tr>${a.map(s=>`<tr><td>${s.date}</td><td><b>${esc(s.type)}</b><br><span class='small'>${esc(s.notes)}</span></td><td>${s.rpe}</td><td>${s.finger}<br><span class='small'>${esc(s.fstatus)}</span></td><td>${esc(s.grade)}<br><span class='small'>${(s.stress||[]).map(esc).join(', ')}</span></td></tr>`).join('')}</table>`}
function fingerP(){finger.innerHTML=`<div class='grid'><div class='card'><h2>Density</h2><div class='notice'>1x/10 Tage. 20 mm komfortabel. 3-5 x 20-40s. RPE 5-6. Pause 2-3 min. Nicht auf 10/6 mm.</div></div><div class='card'><h2>Recruitment</h2><div class='notice'>1x/10 Tage. 20/10 mm. 3-5 x 3-5s. RPE 7-8. Kein Max-Test.</div></div><div class='card'><h2>6-8 mm Gewöhnung</h2><div class='notice'>Optional alle 10-14 Tage, nur bei perfekten Fingern. Assistiert, 3-4 x 3-5s, RPE 6-7.</div></div><div class='card bad'><h2>Ringband-Regeln</h2><div class='notice'>Morgendliche Steifigkeit: Board/Crimps raus. Druckempfindlichkeit: 48-72h keine Fingerlast. Schmerz: abbrechen, nicht diskutieren.</div></div></div>`}
function strengthP(){strength.innerHTML=`<div class='grid'><div class='card'><h2>Block A: Beine/Hooks/Core</h2><div class='notice'>Bulgarian Split Squat 3x6-10/Seite. Assisted Pistol 3x3-6. Sliding Leg Curl 3x6-10. Copenhagen leicht 2-3x10-20s. Hip Flexor Raises 2-3x8-12. Side Plank Reach 2x8.</div></div><div class='card'><h2>Block B: Schulter/Wall Crawls</h2><div class='notice'>Wall Crawls 2-4x2-5 RPE 4-6. Face Pulls 2-3x12-20. Außenrotation 2-3x12-20. Push-ups/Dips leicht. Ring Rows.</div></div><div class='card'><h2>Conditioning</h2><div class='notice'>Spazieren 30-60 min, 3-6x/Woche. Easy Circuit 1x/10 Tage: 8-15 leichte Boulder, große Griffe. Intensives Cardio selten.</div></div><div class='card warn'><h2>Interferenz-Regel</h2><div class='notice'>Krafttraining soll Bouldern ermöglichen, nicht ersetzen. Kein Bein/Core-Massaker vor Skill- oder Board-Haupttagen.</div></div></div>`}
function techP(){tech.innerHTML=`<div class='card'><h2>Technikbibliothek</h2>${drills.map(d=>`<div class='notice' style='margin-bottom:8px'><b>${d[0]}</b><br><span class='pill blue'>${d[1]}</span><br><span class='small'>${d[2]}</span></div>`).join('')}</div>`}
function moonP(){moon.innerHTML=`<div class='card'><h2>MoonBoard / Marker</h2><label>Name/Zug</label><input id='mn'><div class='row'><div><label>Grad</label><select id='mg'><option>6C</option><option>6C+</option><option>7A</option><option>7A+</option><option>7B</option><option>7B+</option><option>7C</option></select></div><div><label>Status</label><select id='ms'><option>versucht</option><option>Einzelzug geschafft</option><option>in Links</option><option>Top</option><option>wiederholbar</option></select></div></div><label>Limiter/Notiz</label><textarea id='mt'></textarea><button class='pri' onclick='addMoon()'>Speichern</button></div><div class='card'><h2>Marker-Historie</h2>${moonTable()}</div><div class='card'><h2>Testsystem</h2><div class='notice'>5 wiederholbare 7A und 5 schwere Einzelzüge aus 7A+/7B. Alle 2 Wochen testen, aber nicht zerstören. Entscheidend: weniger Versuche, bessere Catches, Fuß bleibt, Fingerreaktion am nächsten Morgen.</div></div>`}
function addMoon(){data.moon.push({date:today,name:mn.value,grade:mg.value,status:ms.value,note:mt.value});save();render()}function moonTable(){if(!data.moon.length)return `<div class='small'>Noch keine Marker.</div>`;return `<table><tr><th>Datum</th><th>Name</th><th>Grad</th><th>Status</th></tr>${data.moon.map(m=>`<tr><td>${m.date}</td><td>${esc(m.name)}<br><span class='small'>${esc(m.note)}</span></td><td>${m.grade}</td><td>${m.status}</td></tr>`).join('')}</table>`}
function anaP(){let a=data.sessions,w4=[0,1,2,3].map(i=>{let lo=i*7,hi=lo+7,r=a.filter(s=>daysAgo(s.date)>=lo&&daysAgo(s.date)<hi);return{lab:`${lo}-${hi-1} Tage`,sum:r.reduce((x,s)=>x+n(s.rpe),0),cl:r.filter(isClimb).length,fi:r.length?r.reduce((x,s)=>x+n(s.finger),0)/r.length:0}});let typesCount={};a.forEach(s=>typesCount[s.type]=(typesCount[s.type]||0)+1);ana.innerHTML=`<div class='card'><h2>4-Wochen-Last</h2><table><tr><th>Zeitraum</th><th>RPE</th><th>Klettertage</th><th>Ø Finger</th></tr>${w4.map(w=>`<tr><td>${w.lab}</td><td>${w.sum}</td><td>${w.cl}</td><td>${w.fi.toFixed(1)}</td></tr>`).join('')}</table></div><div class='card'><h2>Session-Verteilung</h2>${Object.keys(typesCount).length?`<table>${Object.entries(typesCount).map(e=>`<tr><td>${esc(e[0])}</td><td>${e[1]}</td></tr>`).join('')}</table>`:`<div class='small'>Noch keine Daten.</div>`}</div><div class='card'><h2>Interpretation</h2><div class='notice'>Wenn zu viele Sessions RPE 5-7 sind, fehlt Kontrast. Capacity heißt: viele saubere 3-5er/4er/5er, aber wenig echte 6er-Projektlast. Wenn Finger-RPE steigt, reduzierst du nicht nur Schwierigkeit, sondern Griffstress.</div></div>`}
function dataP(){data.innerHTML=`<div class='card'><h2>Daten</h2><button class='pri' onclick='exp()'>Export JSON</button><label>Import JSON</label><textarea id='imp'></textarea><button class='sec' onclick='impData()'>Importieren</button><button class='sec' onclick='if(confirm(\'Alles löschen?\')){localStorage.removeItem(\'bsc52\');data=base();save();render()}'>Alles löschen</button></div>`}
function exp(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='boulder-super-coach-52-data.json';a.click()}function impData(){try{data=JSON.parse(document.getElementById('imp').value);save();render()}catch(e){alert('Import fehlgeschlagen')}}
nav();render();
</script>
