const blocks=[
{key:'capacity',name:'Capacity + Bewegung',weeks:'1-10',cls:'cap',why:'Du sammelst saubere Bewegungen und machst moderate Belastung billig. Das Ziel ist nicht, 6er zu erzwingen, sondern 4er technisch fast gratis und 5er deutlich wiederholbarer zu machen.',week:'4 echte Bouldertage, 1 optionaler leichter Technikslot, 1 Conditioning/Finger-Capacity, 1 komplette Pause.',grade:'1-2 Warm-up/Cooldown. 3 Technik. 4 Hauptvolumen. 5 submax Entwicklung. 6 nur kurz ab Woche 3.',progress:['W1-2: Kalibrierung, keine 6er, RPE sauber lernen.','W3-4: Volumenaufbau, 3-5 kurze 6er-Versuche pro Woche.','W5-6: Capacity-Peak, 4-5 Bouldertage nur bei perfekten Fingern.','W7: Deload, 30-40 Prozent weniger Volumen.','W8-9: spezifische Capacity, mehr 5er-Flash/2nd-go.','W10: Mini-Test, 4er/5er-Quote, 6er nur antasten.'],sessions:['Submax Capacity 90-105 min: 8-12 Warm-up, 4-6 4er, 6-10 5er, 2-3 Wiederholungen.','Technikvolumen 75-90 min: 3er/4er mit Silent Feet, Hüfte vor Hand, No-Pull.','Skill-Projekt 90 min: 2 technische Probleme, Grad 4-5, filmen nach 5 Versuchen.','Conditioning 45-60 min: Beine, Hüfte, Hamstrings, Core, Wall Crawls, optional 20mm Density.'],stop:['Finger-RPE 7 oder höher: keine kleinen Leisten, kein Board.','5+ Versuche ohne Bewegungsverbesserung: Boulder abbrechen.','4er fühlen sich plötzlich schwer an: Volumen sofort runter.']},
{key:'strength',name:'Strength + Boardkraft',weeks:'12-20',cls:'str',why:'Nach Capacity ist dein System bereit, höhere Kraftreize besser zu verwerten. Ziel ist nicht blindes Maxen, sondern starke Positionen, bessere Haltekraft in Boardwinkeln und mehr Kontrolle an schweren 5ern/kurzen 6er-Zügen.',week:'4 Bouldertage, 1 Kraft/Finger-Recruitment-Tag, 1 optionaler Technik-Low-Day, 1 Pause. Maximal 2 fingerharte Tage pro 7 Tage.',grade:'4 bleibt Warm-up/Technik. 5 wird Hauptarbeitsgrad. 6 wird als kurze Einzelzug- oder Sequenzexposition genutzt, nicht als 45-Minuten-Projekt.',progress:['W12-13: Einstieg. 2 Boardtage RPE 6-7, Recruitment nur RPE 7, keine Max-Tests.','W14-16: Aufbau. 1 Strength-Boardtag RPE 7-8, 1 submax Boardtag, 1 Skilltag, 1 Techniktag.','W17: Konsolidierung. Volumen minus 20 Prozent, Intensität erhalten, Finger frisch halten.','W18-20: spezifische Stärke. 6er-Züge kurz, 5er schwerer und sauberer, lange Pausen, weniger Gesamtvolumen.'],sessions:['Strength-Board 85-100 min: Warm-up 20 min, 5-8 harte Einzelzüge/Sequenzen, 3-5 min Pause, dann 3-5 submax 5er.','Recruitment-Finger 35-50 min: 20/10mm, 3-5x3-5s, RPE 7-8, danach Schulter/Beine.','Submax Board 80-95 min: 5er wiederholen, 4er technisch billig, kein Projektkrieg.','Skilltag 75-90 min: Hooks, hohe Füße, Hüftpositionen, Volumen/Koordination.'],stop:['Nie Recruitment am Tag nach fingerhartem Board.','Wenn Ringband morgens steif ist: Strength-Block wird zu Technik/Prehab.','6er-Dosis: 6-12 gute Versuche pro Woche, nicht pro Session.']},
{key:'power',name:'Power + Kontaktkraft',weeks:'22-29',cls:'pow',why:'Jetzt geht es um hohe Qualität bei niedriger Menge: schnelle Catches, harte Deadpoints, Kontaktspannung und explosive Boardzüge. Du trainierst frisch, pausierst lang und hörst früh auf.',week:'3-4 Bouldertage. 2 harte Power-Reize pro 10 Tage. Dazwischen Technik, Low-Day, Mobility und Prehab. Keine hohe Wochendichte.',grade:'5 als vorbereitende und wiederholbare Powerbasis. 6 als kurze Power-Exposition. 4 nur Warm-up/Präzision.',progress:['W22-23: Power-Einstieg. Wenig Volumen, harte Züge nur wenn Catches sauber bleiben.','W24-26: Hauptblock. 2 rote Tage pro 10 Tage, lange Pausen, 6er-Züge/Board-Einzelzüge.','W27: Mini-Deload innerhalb des Blocks, Volumen minus 30 Prozent.','W28-29: spezifische Power. Wenige hochwertige Züge, keine Müdigkeits-Power.'],sessions:['Power-Day 75-90 min: 20-25 min Warm-up, 4-8 harte Einzelzüge, 3-5 min Pause, 2-4 leichte Wiederholungen.','Contact-Session 60-75 min: Deadpoint-Kontrolle, Fuß bleibt, leiser Catch, kein Cut-loose wenn vermeidbar.','Technique-Low 45-75 min: Grad 2-4, Bewegungsqualität, keine Fingerlast.','Antagonist/Prehab 35-50 min: Schulter, Wall Crawls leicht, Core, Mobility.'],stop:['Wenn der erste Kontakt laut/hart/unkontrolliert wird: Session beenden.','Keine Power unter Müdigkeit. Schlechte Catches trainieren schlechte Catches.','Nach RPE 9 mindestens 48h keine Fingerlast.']},
{key:'pe',name:'Power-Endurance + Projektkapazität',weeks:'31-38',cls:'pe',why:'Du lernst, mehrere harte Versuche in einer Session produktiv zu halten. Ziel ist nicht Pump um jeden Preis, sondern mehr hochwertige Versuche, bessere Links und weniger Leistungsabfall.',week:'4 Bouldertage, davon 1 Projektkapazität, 1 submax Board, 1 Technik/Skill, 1 Volumen/Repeat. 1 Kraft/Prehab kurz, 1 Pause.',grade:'4 und 5 werden für Wiederholungen und Links genutzt. 6 wird projektorientiert, aber mit Versuchslimit und klaren Pausen.',progress:['W31-32: Einstieg. Wiederholungen an 4ern/5ern, keine brutalen Zirkel.','W33-35: Aufbau. Links, 5er-Cluster, 2-3 Boulder ähnlicher Art, kontrollierte Pausen.','W36: Entlastung minus 25-35 Prozent.','W37-38: spezifische Projektkapazität. 6er-Projekt kurz, dann 5er-Qualität erhalten.'],sessions:['Projektkapazität 90-105 min: 1 Hauptboulder 20-30 min mit Versuchslimit, dann 3-5 5er/Links.','Repeat-Session 75-90 min: 4-6 4er/5er je 2 Wiederholungen, Qualität gleich halten.','Cluster 60-80 min: 3 Boulder ähnlich, je 2-4 Versuche, 4-6 min zwischen Clustern.','Skill/Technik 75 min: technische Limiter ohne maximale Fingerlast.'],stop:['Pump darf steigen, Finger-RPE nicht.','Wenn Beta schlechter wird statt besser: Pause verlängern oder abbrechen.','Nicht mehr als 1 echtes Projekt pro Session.']},
{key:'performance',name:'Performance / 8A-orientiert',weeks:'40-48',cls:'perf',why:'Jetzt reduzierst du Breite und erhöhst Spezifität. Du suchst nicht mehr überall Reize, sondern organisierst Frische für Zielboulder, harte Projekte und reale Leistung.',week:'3-4 Bouldertage. 1-2 Performance-/Projekt-Tage, 1 Erhaltungstag, 1 Technik/Recovery. Deload/Taper nach Bedarf.',grade:'4/5 nur zur Vorbereitung und Erhaltung. 6 und projektnahe Boulder gezielt, mit klaren Stop-Regeln. Kein zufälliges Volumen.',progress:['W40-41: Projektwahl. 2-3 Zielboulder, Limiter analysieren, keine Volumen-Eskalation.','W42-44: Hauptperformance. Frisch in harte Tage, lange Pausen, wenige hochwertige Versuche.','W45: Taper-Woche. Volumen minus 40 Prozent, Intensität kurz erhalten.','W46-48: Peak-Fenster. Top-Versuche nur bei hoher Readiness, sonst Erhaltung/Technik.'],sessions:['Performance-Day 75-105 min: langer Warm-up, 1 Zielboulder, 6-10 sehr gute Versuche, 4-6 min Pause.','Primer 35-50 min: 3-5 leichte Powerzüge, 2-3 5er, abbrechen frisch.','Erhaltung 70-85 min: 4er/5er sauber, wenige harte Züge, keine Erschöpfung.','Taper/Recovery 30-60 min: Bewegung, Mobility, mentale Beta, kein Müdigkeitstraining.'],stop:['Wenn Readiness unter 70: kein Peak-Versuch.','Maximal 2 echte Performance-Tage pro Woche.','Nach einem erfolgreichen harten Top nicht direkt weiter zerstören. Adaptation sichern.']},
{key:'test',name:'Test + Standortbestimmung',weeks:'49',cls:'perf',why:'Diese Woche ist nicht zum maximalen Zerstören da. Sie prüft, was wirklich besser wurde: 5er-Quote, Wiederholbarkeit, 6er-Qualität, Fingerreaktion und MoonBoard-Marker.',week:'3 Bouldertage, 2 Pausen, 1 leichter Techniktag, 1 Analyse/Prehab.',grade:'Test: 8-12 4er, 6-8 5er mit maximal 3 Versuchen, 1-2 6er mit maximal 3 Versuchen.',progress:['Tag 1: Technik- und 4er-Test.','Tag 3 oder 4: 5er-Quote und Wiederholbarkeit.','Tag 6: kurze 6er-/MoonBoard-Marker, nur wenn Finger normal.','Tag 7: Analyse und Entscheidung für nächsten Zyklus.'],sessions:['4er-Test: Wie viele werden flashbar und technisch sauber?','5er-Test: Top in maximal 3 Versuchen, Quote notieren.','6er-Touch: Kein Projektkrieg, nur Qualität prüfen.','Fingercheck: nächster Morgen entscheidet, ob Jahr gut belastet wurde.'],stop:['Kein Jahresabschluss durch Verletzung erzwingen.','Wenn Test schlechter läuft, ist das Datenerhebung, kein Grund zur Eskalation.']},
{key:'transition',name:'Transition / Rebuild',weeks:'50-52',cls:'del',why:'Nach einem Jahr brauchst du psychischen und geweblichen Reset. Der Block hält dich beweglich, gesund und motiviert, ohne direkt wieder Belastung zu stapeln.',week:'2-4 lockere Bouldertage, viel Technik, viel draußen gehen, Prehab, Spaßboulder. Keine systematische Maxphase.',grade:'1-4 viel, 5 gelegentlich, 6 nur spielerisch und nicht fingerlastig.',progress:['W50: Reduktion und Spaß.','W51: Technik neu sortieren, alte Videos vergleichen.','W52: nächstes Jahr planen, Ziele und Limiter aktualisieren.'],sessions:['Leichtes Bouldern 45-75 min.','Videoanalyse 30 min.','Prehab/Wall Crawls leicht 30-45 min.','Outdoor/Spaziergänge/aktive Erholung.'],stop:['Wenn du dich direkt wieder beweisen willst, ist der Block nicht erfüllt.','Keine versteckte Peakphase.']}
];
const cycle=[['Board submax','90-105 min','RPE 6','8-12 Warm-up 1-3, 4-6 4er, 6-10 5er, 2-3 Wiederholungen. Pausen: 4er 1-2 min, 5er 2-4 min.'],['Conditioning + Density','45-60 min','RPE 4-5','Beine, Hamstrings, Hüfte, Wall Crawls. Optional 20 mm Density 3-4x20-40s RPE 5-6.'],['Technikvolumen','75-90 min','RPE 3-4','6-8 Warm-up, 6-8 3er, 8-12 4er, 2-4 leichte 5er. Silent Feet, No-Pull, Hüfte vor Hand.'],['Pause','0-30 min','RPE 0-2','Spaziergang, Mobility, kein Board, keine Fingerlast.'],['Skill-Projekt','90 min','RPE 5-6','Hooks, Volumen, Koordination, Kreuzzüge. 2 Hauptprobleme, filmen nach 5 Versuchen, stoppen wenn Qualität sinkt.'],['Technik/Volumen','75-90 min','RPE 3-5','Viele 3er/4er, wenige 5er. Bewegungsbibliothek.'],['Mini-Hard-Reiz','45-70 min','RPE 7-8 kurz','3-5 harte Einzelzüge oder 5-8 kurze 6er-Touches. Keine 30 Versuche, lange Pausen.'],['Low-Day','0-45 min','RPE 0-2','Erholung erzwingen.'],['Hallencapacity','90 min','RPE 5-6','athletische 4er, submax 5er, 3 Boulder nochmal besser. Keine maximal fingerlastigen 6er.'],['Analyse + Prehab','30-60 min','RPE 1-3','Video, Mobility, Wall Crawls leicht, ein Cue für nächsten Zyklus.']];
const drills=[['Fußdruck halten','Der Fuß bleibt bis nach dem Catch aktiv.','Submax 4er/5er, zählen wie oft der Fuß nach Kontakt bleibt.'],['Hüfte vor Hand','Erst Schwerpunkt, dann Griff.','Vor jedem schweren Zug Setup 1s einfrieren.'],['Aktiver Hook','Hook macht mich kurz.','Hook setzen, 2s Spannung, dann Hand bewegen.'],['Less Pull / More Feet','Wenn ich stark ziehen muss, war die Position schlecht.','Leichte 3er/4er mit langen Armen.'],['Silent Feet','Leiser Fuß ist präziser Fuß.','10 Boulder ohne hörbares Setzen/Nachrutschen.'],['Repeat Better','Jede Wiederholung billiger.','Einen 4er/5er dreimal klettern, jedes Mal weniger Kraft.'],['Beta-Entscheidung','Ein Versuch, ein Cue.','Motorfuß, Hüftweg, Catch, No-Cut-Punkt definieren.']];
const types=['Board submax','Technikvolumen','Skill-Projekt','Hallencapacity','Mini-Hard-Reiz','Power-Day','Performance-Day','Projektkapazität','Kraft/Capacity','Finger Density','Finger Recruitment','Mobility/Analyse','Pause'];
const stress=['kleine Leisten','dynamische Catches','Hooks','derselbe Zug oft','6er-Touch','MoonBoard/Spraywall','Haut limitiert','Full Crimp','Kompression','Volumen','Platte'];
function E(id){return document.getElementById(id)}function esc(x){return String(x??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function num(x){return Number(x||0)}function base(){return{start:today,week:1,sessions:[],moon:[],goals:[['7A/5er zuverlässiger','5er-Quote 75-85 Prozent, weniger Versuche','aktiv'],['12 Monate fingergesund','Keine Ringbandreaktion nach Boardtagen','aktiv'],['Mehr über Füße ziehen','4er/5er mit weniger Cut-loose','aktiv']]}}let data;try{data=JSON.parse(localStorage.bsc52full||'null')||base()}catch(e){data=base()}function save(){localStorage.bsc52full=JSON.stringify(data)}function diff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}function age(ds){return diff(ds,today)}function recent(k){return data.sessions.filter(s=>age(s.date)>=0&&age(s.date)<k)}function isClimb(s){return !['Pause','Mobility/Analyse','Kraft/Capacity','Finger Density','Finger Recruitment'].includes(s.type)&&num(s.rpe)>0}function phaseFor(w){return phases.find(p=>w>=p.a&&w<=p.b)||phases[0]}function cycleFor(ds){let i=((diff(data.start,ds)%10)+10)%10;return cycle[i]}function status(){let r=recent(10),sum=r.reduce((a,s)=>a+num(s.rpe),0),cl=r.filter(isClimb).length,avg=r.length?r.reduce((a,s)=>a+num(s.finger),0)/r.length:0,last=r.slice().sort((a,b)=>b.date.localeCompare(a.date))[0],score=100,w=[];if(last&&num(last.rpe)>=8){score-=30;w.push('Letzte Session RPE >=8: heute Pause oder RPE 0-3.')}if(last&&num(last.finger)>=7){score-=30;w.push('Finger-RPE hoch: keine kleinen Leisten, kein Board.')}if(r.some(s=>s.fstatus&&s.fstatus!='normal')){score-=40;w.push('Fingerstatus auffällig: Crimps/Board raus.')}if(cl>=8||sum>=50){score-=18;w.push('10-Tage-Block dicht: Low-Day einplanen.')}score=Math.max(0,Math.min(100,Math.round(score)));return{r,sum,cl,avg,last,score,w}}
function clsScore(s){return s<45?'bad':s<70?'warn':'good'}function bar(x,max=100){let p=Math.max(0,Math.min(100,x/max*100));return `<div class='bar'><div style='width:${p}%'></div></div>`}
function nav(){E('nav').innerHTML=tabs.map(t=>`<button id='bt_${t[0]}' onclick='show("${t[0]}")' class='${t[0]=='dash'?'on':''}'>${t[1]}</button>`).join('')}function show(id){tabs.forEach(t=>{E('pg_'+t[0]).classList.toggle('on',t[0]==id);E('bt_'+t[0]).classList.toggle('on',t[0]==id)});render()}function render(){renderDash();renderToday();renderYear();renderBlocks();renderCycle();renderLog();renderFinger();renderTech();renderMoon();renderAnalyse();renderData()}
function renderDash(){let s=status(),p=phaseFor(data.week),c=cycleFor(today);E('pg_dash').innerHTML=`<div class='grid'><div class='card ${clsScore(s.score)}'><h2>Readiness</h2><div class='metric'><span>Score</span><b>${s.score}</b></div>${bar(s.score)}<div class='small'>Gewichtet RPE, Finger-RPE, Fingerstatus, Dichte und letzte harte Einheit.</div></div><div class='card ${p.cls}'><h2>Aktueller Block</h2><div class='notice'><b>Woche ${data.week}: ${p.n}</b><br>${p.r}<br><span class='small'>${p.d}</span></div><label>Aktuelle Woche</label><input type='number' min='1' max='52' value='${data.week}' onchange='data.week=num(this.value);save();render()'></div></div><div class='grid3'><div class='card'><h2>10-Tage-RPE</h2><div class='metric'><span>Summe</span><b>${s.sum}</b></div>${bar(s.sum,60)}</div><div class='card'><h2>Klettertage</h2><div class='metric'><span>letzte 10 Tage</span><b>${s.cl}/10</b></div></div><div class='card'><h2>Ø Finger-RPE</h2><div class='metric'><span>letzte 10 Tage</span><b>${s.avg.toFixed(1)}</b></div></div></div><div class='card'><h2>Heute laut 10-Tage-Zyklus</h2><div class='notice blue'><b>${c[0]}</b> · ${c[2]}<br><span class='small'>${c[1]} · ${c[3]}</span></div></div><div class='card'><h2>Coach-Empfehlung</h2><div class='notice ${clsScore(s.score)}'><b>${s.score<45?'Pause oder RPE 0-3. Kein Board, keine 5er/6er, keine Leisten.':s.score<70?'RPE 3-5, anderer Stressor. Kein Projektkrieg.':'Plan kann gehalten werden, falls Finger/Haut normal sind.'}</b></div>${s.w.length?s.w.map(x=>`<span class='pill bad'>${esc(x)}</span>`).join(''):`<span class='pill good'>Keine akute Warnung.</span>`}</div><div class='card'><h2>Letzte Sessions</h2>${sessionTable(data.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))}</div>`}
function renderToday(){let s=status(),c=cycleFor(today),rec=s.score<45?'Pause/Low-Day':s.score<70&&c[2].includes('8')?'Technik RPE 3-4':c[0];E('pg_today').innerHTML=`<div class='card'><h2>Heute-Coach</h2><div class='metric'><span>Empfohlen</span><b>${esc(rec)}</b></div><div class='notice'><b>Geplant:</b> ${esc(c[0])}<br><b>Dauer:</b> ${esc(c[1])}<br><b>Intensität:</b> ${esc(c[2])}<br><br>${esc(c[3])}</div></div><div class='grid'><div class='card bad'><h2>Harte Regeln</h2><span class='pill bad'>RPE ≥8 → nächster Tag RPE 0-3</span><span class='pill bad'>Finger-RPE ≥7 → kein Board/Crimps</span><span class='pill bad'>Druckempfindlichkeit → 48-72h keine Fingerlast</span><span class='pill warn'>3 Klettertage in Folge → Low-Day</span></div><div class='card'><h2>Hallenskala 1-6</h2><div class='notice'>1-2 Warm-up/Cooldown. 3 Technik. 4 Hauptvolumen. 5 submaximale Entwicklung. 6 je nach Block: in Capacity fast nie, in Strength kurz, in Power hochwertig, in Performance projektbezogen.</div></div></div>`}
function renderYear(){E('pg_year').innerHTML=`<div class='card'><h2>52-Wochen-Jahresstruktur</h2><div class='notice'>Der Plan baut erst Belastbarkeit und Bewegung auf, dann Kraft, dann Power, dann Projektkapazität und zuletzt Performance. Deloads sind eingeplant, weil Fortschritt sonst von Finger/Haut/Nervensystem limitiert wird.</div></div>${phases.map(p=>`<div class='card ${p.cls}'><div class='blocktitle'><h2>Wochen ${p.a}-${p.b}: ${p.n}</h2><span class='pill'>${p.r}</span></div><div class='notice'>${p.d}</div></div>`).join('')}`}
function renderBlocks(){E('pg_blocks').innerHTML=`<div class='card'><h2>Trainingsblöcke im Detail</h2><div class='small'>Hier sind alle Blöcke des 52-Wochen-Plans ausführlich integriert. Nutze den passenden Block je nach aktueller Woche und passe nur über Readiness/Fingerstatus nach unten an.</div></div>${blocks.map(blockCard).join('')}`}
function blockCard(b){return `<div class='card ${b.cls}'><div class='blocktitle'><h2>Wochen ${b.weeks}: ${b.name}</h2><span class='pill'>${b.week}</span></div><h3>Warum dieser Block?</h3><div class='notice'>${b.why}</div><h3>Gradsteuerung</h3><div class='notice blue'>${b.grade}</div><h3>Wochenprogression</h3><table><tr><th>Schritt</th></tr>${b.progress.map(x=>`<tr><td>${x}</td></tr>`).join('')}</table><h3>Sessiontypen</h3><table><tr><th>Einheit</th></tr>${b.sessions.map(x=>`<tr><td>${x}</td></tr>`).join('')}</table><h3>Stop-Regeln</h3>${b.stop.map(x=>`<span class='pill bad'>${x}</span>`).join('')}</div>`}
function renderCycle(){E('pg_cycle').innerHTML=`<div class='card'><h2>10-Tage-Zyklus als Grundgerüst</h2><label>Tag-1-Startdatum</label><input type='date' value='${data.start}' onchange='data.start=this.value;save();render()'><div class='small'>Der Zyklus wird je nach Jahresblock interpretiert: In Capacity mehr Volumen, in Power weniger Volumen und längere Pausen, in Performance projektbezogener.</div></div>${cycle.map((x,i)=>`<div class='card'><h2>Tag ${i+1}: ${x[0]}</h2><span class='pill'>${x[1]}</span><span class='pill'>${x[2]}</span><div class='notice'>${x[3]}</div></div>`).join('')}`}
function renderLog(){E('pg_log').innerHTML=`<div class='card'><h2>Session loggen</h2><label>Datum</label><input id='ld' type='date' value='${today}'><label>Typ</label><select id='lt'>${types.map(t=>`<option>${t}</option>`).join('')}</select><div class='row'><div><label>Gesamt-RPE</label><input id='lr' type='number' value='5' step='.5'></div><div><label>Finger-RPE</label><input id='lf' type='number' value='4' step='.5'></div></div><div class='row'><div><label>Dauer min</label><input id='lm' type='number' value='90'></div><div><label>Schwerpunkt Hallengrad</label><select id='lg'><option>1-3</option><option>4</option><option>5</option><option>6 kurz</option><option>MoonBoard</option></select></div></div><label>Fingerstatus</label><select id='lfs'><option>normal</option><option>leichte Steifigkeit</option><option>leichte Druckempfindlichkeit</option><option>Schmerz/Unsicherheit</option></select><label>Stressoren</label>${stress.map((x,i)=>`<label><input id='st${i}' type='checkbox' style='width:auto'> ${x}</label>`).join('')}<label>Learning / Ergebnis</label><textarea id='ln'></textarea><button class='pri' onclick='addLog()'>Speichern</button></div><div class='card'><h2>Historie</h2>${sessionTable(data.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,45))}</div>`}
function addLog(){let st=stress.filter((_,i)=>E('st'+i).checked);data.sessions.push({date:E('ld').value,type:E('lt').value,rpe:num(E('lr').value),finger:num(E('lf').value),min:num(E('lm').value),grade:E('lg').value,fstatus:E('lfs').value,stress:st,notes:E('ln').value});save();render()}function sessionTable(a){if(!a.length)return `<div class='small'>Noch keine Einträge.</div>`;return `<table><tr><th>Datum</th><th>Typ</th><th>RPE</th><th>Finger</th><th>Fokus</th></tr>${a.map(s=>`<tr><td>${s.date}</td><td><b>${esc(s.type)}</b><br><span class='small'>${esc(s.notes)}</span></td><td>${s.rpe}</td><td>${s.finger}<br><span class='small'>${esc(s.fstatus)}</span></td><td>${esc(s.grade)}<br><span class='small'>${(s.stress||[]).map(esc).join(', ')}</span></td></tr>`).join('')}</table>`}
function renderFinger(){E('pg_finger').innerHTML=`<div class='grid'><div class='card'><h2>Density</h2><div class='notice'>1x/10 Tage. 20 mm komfortabel. 3-5 x 20-40s. RPE 5-6. Pause 2-3 min. Nicht auf 10/6 mm.</div></div><div class='card'><h2>Recruitment</h2><div class='notice'>In Strength/Power 1x/10 Tage. 20/10 mm. 3-5 x 3-5s. RPE 7-8. Kein Max-Test in laufenden Belastungswochen.</div></div><div class='card'><h2>6-8 mm Gewöhnung</h2><div class='notice'>Optional alle 10-14 Tage, nur bei perfekten Fingern. Assistiert, 3-4 x 3-5s, RPE 6-7. Kein Full-Crimp-Zwang.</div></div><div class='card bad'><h2>Ringband-Regeln</h2><div class='notice'>Morgendliche Steifigkeit: Board/Crimps raus. Druckempfindlichkeit: 48-72h keine Fingerlast. Schmerz: abbrechen, nicht diskutieren.</div></div><div class='card'><h2>Beine/Hooks/Core</h2><div class='notice'>Bulgarian Split Squat 3x6-10/Seite. Assisted Pistol 3x3-6. Sliding Leg Curl 3x6-10. Copenhagen leicht 2-3x10-20s. Hip Flexor Raises 2-3x8-12.</div></div><div class='card'><h2>Schulter/Wall Crawls</h2><div class='notice'>Wall Crawls 2-4x2-5 RPE 4-6. Face Pulls 2-3x12-20. Außenrotation 2-3x12-20. Push-ups/Dips leicht. Ring Rows.</div></div></div>`}
function renderTech(){E('pg_tech').innerHTML=`<div class='card'><h2>Technikbibliothek</h2>${drills.map(d=>`<div class='notice' style='margin-bottom:8px'><b>${d[0]}</b><br><span class='pill blue'>${d[1]}</span><br><span class='small'>${d[2]}</span></div>`).join('')}</div>`}
function renderMoon(){E('pg_moon').innerHTML=`<div class='card'><h2>MoonBoard / Marker</h2><label>Name/Zug</label><input id='mn'><div class='row'><div><label>Grad</label><select id='mg'><option>6C</option><option>6C+</option><option>7A</option><option>7A+</option><option>7B</option><option>7B+</option><option>7C</option></select></div><div><label>Status</label><select id='ms'><option>versucht</option><option>Einzelzug geschafft</option><option>in Links</option><option>Top</option><option>wiederholbar</option></select></div></div><label>Limiter/Notiz</label><textarea id='mt'></textarea><button class='pri' onclick='addMoon()'>Speichern</button></div><div class='card'><h2>Marker-Historie</h2>${moonTable()}</div><div class='card'><h2>Testsystem</h2><div class='notice'>5 wiederholbare 7A und 5 schwere Einzelzüge aus 7A+/7B. Alle 2 Wochen testen, aber nicht zerstören. Entscheidend: weniger Versuche, bessere Catches, Fuß bleibt, Fingerreaktion am nächsten Morgen.</div></div>`}function addMoon(){data.moon.push({date:today,name:E('mn').value,grade:E('mg').value,status:E('ms').value,note:E('mt').value});save();render()}function moonTable(){if(!data.moon.length)return `<div class='small'>Noch keine Marker.</div>`;return `<table><tr><th>Datum</th><th>Name</th><th>Grad</th><th>Status</th></tr>${data.moon.map(m=>`<tr><td>${m.date}</td><td>${esc(m.name)}<br><span class='small'>${esc(m.note)}</span></td><td>${m.grade}</td><td>${m.status}</td></tr>`).join('')}</table>`}
function renderAnalyse(){let a=data.sessions,w4=[0,1,2,3].map(i=>{let lo=i*7,hi=lo+7,r=a.filter(s=>age(s.date)>=lo&&age(s.date)<hi);return{lab:`${lo}-${hi-1} Tage`,sum:r.reduce((x,s)=>x+num(s.rpe),0),cl:r.filter(isClimb).length,fi:r.length?r.reduce((x,s)=>x+num(s.finger),0)/r.length:0}});let tc={};a.forEach(s=>tc[s.type]=(tc[s.type]||0)+1);E('pg_analyse').innerHTML=`<div class='card'><h2>4-Wochen-Last</h2><table><tr><th>Zeitraum</th><th>RPE</th><th>Klettertage</th><th>Ø Finger</th></tr>${w4.map(w=>`<tr><td>${w.lab}</td><td>${w.sum}</td><td>${w.cl}</td><td>${w.fi.toFixed(1)}</td></tr>`).join('')}</table></div><div class='card'><h2>Session-Verteilung</h2>${Object.keys(tc).length?`<table>${Object.entries(tc).map(e=>`<tr><td>${esc(e[0])}</td><td>${e[1]}</td></tr>`).join('')}</table>`:`<div class='small'>Noch keine Daten.</div>`}</div><div class='card'><h2>Interpretation</h2><div class='notice'>Wenn zu viele Sessions RPE 5-7 sind, fehlt Kontrast. Capacity heißt viele saubere Kontakte. Strength heißt wenige harte, kontrollierte Reize. Power heißt frisch und explosiv. Performance heißt Volumen runter und Qualität hoch.</div></div>`}
function renderData(){E('pg_data').innerHTML=`<div class='card'><h2>Daten</h2><button class='pri' onclick='exportData()'>Export JSON</button><label>Import JSON</label><textarea id='imp'></textarea><button class='sec' onclick='importData()'>Importieren</button><button class='sec' onclick='if(confirm("Alles löschen?")){localStorage.removeItem("bsc52full");data=base();save();render()}'>Alles löschen</button></div>`}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='boulder-super-coach-52-data.json';a.click()}function importData(){try{data=JSON.parse(E('imp').value);save();render()}catch(e){alert('Import fehlgeschlagen')}}
nav();render();
</script>
</body>
</html>
